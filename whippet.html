<style>
  :root {
    --ink: #1a1612;
    --paper: #f5f0e8;
    --aged: #e8dfc8;
    --rust: #b5451b;
    --steel: #4a5568;
    --muted: #7c6f5e;
    --highlight: #fff3cd;

    --content-width: 72ch;
    --page-pad: clamp(1rem, 3vw, 2rem);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    font-size: clamp(1rem, 0.95rem + 0.3vw, 1.125rem);
    line-height: 1.75;
    overflow-x: hidden;
  }

  img, video, svg {
    max-width: 100%;
    height: auto;
  }

  article {
    width: min(var(--content-width), calc(100% - 2 * var(--page-pad)));
    margin-inline: auto;
  }

  .hero,
  .content {
    padding-inline: 0;
  }

  .hero {
    padding-top: clamp(2rem, 5vw, 4rem);
    border-bottom: 3px double var(--ink);
  }

  .hero-inner,
  .content {
    max-width: var(--content-width);
    margin-inline: auto;
  }

  .hero-inner,
  .content {
    padding-inline: var(--page-pad);
  }

  .hero h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.2rem, 4vw, 4.5rem);
    line-height: 1.05;
    margin: 0 0 0.5rem;
    overflow-wrap: anywhere;
  }

  .hero-subtitle {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(1.05rem, 0.95rem + 0.6vw, 1.35rem);
    font-style: italic;
    color: var(--muted);
    margin: 0 0 1.5rem;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1rem;
    align-items: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--muted);
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--aged);
  }

  .content {
    padding-top: clamp(1.75rem, 4vw, 3rem);
    padding-bottom: clamp(3rem, 6vw, 5rem);
  }

  .content > * + * {
    margin-top: 1.25rem;
  }

  p {
    margin: 0;
    max-width: 70ch;
  }

  h2 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.25rem);
    line-height: 1.15;
    margin-top: 3rem;
    margin-bottom: 0.25rem;
    overflow-wrap: anywhere;
  }

  h3 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(1.2rem, 1rem + 0.6vw, 1.5rem);
    line-height: 1.25;
    margin-top: 2rem;
    margin-bottom: 0.25rem;
  }

  .drop-cap::first-letter {
    float: left;
    font-family: "Playfair Display", Georgia, serif;
    font-size: 4rem;
    line-height: 0.8;
    margin: 0.05em 0.08em 0 0;
    color: var(--rust);
  }

  .pull-quote,
  .key-statement {
    margin: 2rem 0;
    padding: 1rem 1.25rem;
    border-left: 4px solid var(--rust);
    background: var(--aged);
  }

  .pull-quote p,
  .key-statement p {
    margin: 0;
  }

  .checklist {
    list-style: none;
    padding: 0;
    margin: 1rem 0;
    border-top: 1px solid var(--aged);
  }

  .checklist li {
    padding: 0.6rem 0 0.6rem 1.6rem;
    border-bottom: 1px solid var(--aged);
    position: relative;
  }

  .checklist li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--rust);
  }

  .meme-frame {
    width: 100%;
    max-width: 460px;
    aspect-ratio: 16 / 9;
    border: 2px dashed var(--muted);
    border-radius: 6px;
    background: var(--aged);
    display: grid;
    place-items: center;
    text-align: center;
    padding: 1rem;
  }

  .next-post {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1rem;
    align-items: end;
    border-top: 3px double var(--ink);
    padding-top: 2rem;
    margin-top: 3rem;
  }

  @media (max-width: 600px) {
    .next-post {
      grid-template-columns: 1fr;
    }

    .next-arrow {
      display: none;
    }

    .drop-cap::first-letter {
      font-size: 3.3rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
