<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="A reflective story about a first real penetration test, imposter syndrome, and building a better methodology."
  />
  <title>My First Penetration Test: A Quiet Network, A Loud Lesson</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #0a0a0a;
      --bg-elevated: rgba(20, 20, 20, 0.75);
      --surface: #111111;
      --surface-2: #161616;
      --surface-3: #1c1c1c;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #e6e6e6;
      --text-soft: #cfcfcf;
      --text-muted: #9a9a9a;
      --heading: #ffffff;
      --accent: #d4d4d4;
      --accent-2: #a3a3a3;
      --accent-3: #737373;
      --success: #bfbfbf;
      --quote-bg: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(200,200,200,0.05));
      --callout-bg: linear-gradient(135deg, rgba(200,200,200,0.08), rgba(255,255,255,0.04));
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.6);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.4);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --max-width: 760px;
      color-scheme: dark;
    }

    html[data-theme="light"] {
      --bg: #ffffff;
      --bg-elevated: rgba(255, 255, 255, 0.9);
      --surface: #ffffff;
      --surface-2: #f5f5f5;
      --surface-3: #eaeaea;
      --border: rgba(0, 0, 0, 0.1);
      --border-strong: rgba(0, 0, 0, 0.16);
      --text: #333333;
      --text-soft: #4a4a4a;
      --text-muted: #6a6a6a;
      --heading: #000000;
      --accent: #444444;
      --accent-2: #777777;
      --accent-3: #999999;
      --success: #666666;
      --quote-bg: linear-gradient(135deg, rgba(0,0,0,0.05), rgba(100,100,100,0.04));
      --callout-bg: linear-gradient(135deg, rgba(100,100,100,0.06), rgba(0,0,0,0.04));
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.08);
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.05), transparent 24%),
        radial-gradient(circle at top right, rgba(200,200,200,0.05), transparent 20%),
        linear-gradient(180deg, #0a0a0a 0%, #111111 55%, #0a0a0a 100%);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.8;
    }

    html[data-theme="light"] body {
      background:
        radial-gradient(circle at top left, rgba(0,0,0,0.03), transparent 24%),
        radial-gradient(circle at top right, rgba(0,0,0,0.02), transparent 20%),
        linear-gradient(180deg, #ffffff 0%, #f5f5f5 55%, #eeeeee 100%);
    }

    a { color: var(--accent); }
    a:hover { color: var(--heading); }

    .series-tag {
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: var(--text-soft);
    }

    .series-tag::before {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    .hero h1 em {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      color: transparent;
    }

    h2::before {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .pull-quote {
      background: var(--quote-bg), linear-gradient(180deg, #111, #0a0a0a);
      border-color: rgba(255,255,255,0.1);
    }

    .pull-quote p::before,
    .pull-quote p::after {
      color: var(--accent-2);
    }

    .key-statement {
      background: var(--callout-bg), linear-gradient(180deg, #111, #0a0a0a);
      border-color: rgba(255,255,255,0.1);
    }

    .key-statement::before {
      background: linear-gradient(180deg, var(--accent-3), var(--accent));
    }

    .checklist li {
      background: rgba(255,255,255,0.04);
    }

    .checklist li:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
    }

    .checklist li::before {
      background: rgba(255,255,255,0.08);
      color: var(--accent);
    }

    .meme-link {
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: var(--text-soft);
    }

    .meme-link:hover {
      background: rgba(255,255,255,0.1);
    }

    .sign-off {
      color: var(--text-soft);
    }

    .next-arrow {
      background: rgba(255,255,255,0.08);
      color: var(--accent);
    }

    .next-post:hover {
      border-color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <!-- BODY CONTENT UNCHANGED -->
</body>
</html>
