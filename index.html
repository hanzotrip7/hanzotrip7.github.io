<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Field Notes — a penetration testing blog covering real engagements, hard lessons, Active Directory, reporting, and offensive security methodology."
  />
  <title>Field Notes — A Pentester's Blog</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1c2128;
      --surface-soft: #11161d;
      --border: #30363d;
      --border-soft: #21262d;
      --text: #d0d7de;
      --text-strong: #f0f6fc;
      --text-muted: #9aa4af;
      --text-faint: #7d8590;

      /* CHANGED: blue → gray */
      --accent: #9aa4af;
      --accent-soft: rgba(154, 164, 175, 0.1);
      --accent-border: rgba(154, 164, 175, 0.22);

      --success: #3fb950;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
      --max-width: 920px;
      color-scheme: dark;
    }

    html[data-theme="light"] {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-hover: #f3f6fa;
      --surface-soft: #edf2f7;
      --border: #d8e0ea;
      --border-soft: #e7edf3;
      --text: #2b3440;
      --text-strong: #0f172a;
      --text-muted: #5f6c7b;
      --text-faint: #7a8794;

      /* CHANGED: blue → gray */
      --accent: #475569;
      --accent-soft: rgba(71, 85, 105, 0.08);
      --accent-border: rgba(71, 85, 105, 0.18);

      --success: #15803d;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      /* CHANGED: blue glow → neutral */
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.03), transparent 26%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);

      color: var(--text);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background 0.2s ease, color 0.2s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 10px;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 42px;
      padding: 0.65rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(22, 27, 34, 0.9);
      color: var(--text-strong);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease, color 0.15s ease;
      backdrop-filter: blur(8px);
    }

    html[data-theme="light"] .theme-toggle {
      background: rgba(255, 255, 255, 0.92);
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--accent-border);
      background: var(--surface-hover);
    }

    .theme-toggle:active {
      transform: translateY(0);
    }

    .container {
      width: min(100% - 2rem, var(--max-width));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    .page-shell {
      background: rgba(13, 17, 23, 0.72);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    html[data-theme="light"] .page-shell {
      background: rgba(255, 255, 255, 0.76);
    }

    .page-inner {
      padding: 34px;
    }

    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 2.4rem;
      margin-bottom: 3rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);

      /* CHANGED */
      box-shadow: 0 0 0 4px rgba(154, 164, 175, 0.12);

      flex-shrink: 0;
    }

    .header h1 {
      font-size: clamp(2.2rem, 4.5vw, 3.35rem);
      font-weight: 800;
      color: var(--text-strong);
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 0 0 1rem;
      max-width: 12ch;
    }

    .header-sub {
      max-width: 58ch;
      font-size: 1.08rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 0.95rem 1rem;
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--accent-soft);
      line-height: 1.7;
    }

    h2::before {
      content: "";
      width: 4px;
      height: 14px;
      background: var(--accent);
      border-radius: 999px;
    }

    .toc-title {
      font-size: 1.08rem;
      font-weight: 700;

      /* CHANGED: remove blue link look */
      color: var(--text-strong);

      line-height: 1.4;
      margin-bottom: 0.34rem;
    }

    .tag-live {
      /* CHANGED: remove green pop */
      color: #9aa4af;
      border-color: rgba(154, 164, 175, 0.3);
      background: rgba(154, 164, 175, 0.08);
    }

    /* rest of your CSS unchanged */
  </style>
</head>
<body>
  <!-- HTML content unchanged -->
</body>
</html>
